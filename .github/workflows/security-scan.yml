# security-scan.yml — Reusable security scanning for all jolarca repositories
# Called by individual repos via: uses: jolarca-dev/.github/.github/workflows/security-scan.yml@main
#
# This workflow provides consistent security checks across all repos:
# - Dependency vulnerability scanning (Dependabot/Trivy)
# - Container image scanning (if applicable)
# - Infrastructure as Code scanning (Checkov/tfsec)
# - License compliance checking
#
# Compliance: SOC 2 CC7.1, CC7.2 | ISO 27001 A.12.6.1, A.14.2 | GDPR Art. 25, 32

name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      scan-dependencies:
        description: 'Scan dependencies for vulnerabilities'
        required: false
        default: true
        type: boolean
      scan-containers:
        description: 'Scan container images (if present)'
        required: false
        default: false
        type: boolean
      scan-iac:
        description: 'Scan IaC files (Terraform, K8s)'
        required: false
        default: false
        type: boolean
      check-licenses:
        description: 'Check license compliance'
        required: false
        default: true
        type: boolean
      fail-on-critical:
        description: 'Fail on critical vulnerabilities'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Dependency Vulnerability Scan
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    if: inputs.scan-dependencies
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect package managers
        id: detect
        run: |
          MANAGERS=()
          [ -f "package.json" ] && MANAGERS+=("npm")
          [ -f "requirements.txt" ] && MANAGERS+=("pip")
          [ -f "pyproject.toml" ] && MANAGERS+=("pip")
          [ -f "Pipfile" ] && MANAGERS+=("pip")
          [ -f "Gemfile" ] && MANAGERS+=("bundler")
          [ -f "go.sum" ] && MANAGERS+=("go")
          [ -f "Cargo.lock" ] && MANAGERS+=("cargo")
          
          echo "managers=${MANAGERS[@]}" >> $GITHUB_OUTPUT
          echo "Detected package managers: ${MANAGERS[@]}"

      - name: Run Trivy vulnerability scanner (npm)
        if: contains(steps.detect.outputs.managers, 'npm')
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-npm-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (Python)
        if: contains(steps.detect.outputs.managers, 'pip')
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-python-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '.'
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dependencies scanned: ${{ steps.detect.outputs.managers }}" >> $GITHUB_STEP_SUMMARY
          echo "Severity filter: CRITICAL, HIGH" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Container Image Scan
  # ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    if: inputs.scan-containers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find Dockerfiles
        id: find-dockerfiles
        run: |
          DOCKERFILES=$(find . -name "Dockerfile*" -not -path "./node_modules/*" -not -path "./.terraform/*" || true)
          echo "dockerfiles=$DOCKERFILES" >> $GITHUB_OUTPUT
          echo "Found Dockerfiles: $DOCKERFILES"

      - name: Run Trivy container scan
        if: steps.find-dockerfiles.outputs.dockerfiles != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure as Code Scan
  # ─────────────────────────────────────────────────────────────────────────────
  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    if: inputs.scan-iac
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect IaC files
        id: detect-iac
        run: |
          IAC_FILES=()
          [ -d "terraform" ] && IAC_FILES+=("terraform")
          [ -d "kubernetes" ] && IAC_FILES+=("kubernetes")
          [ -d "ansible" ] && IAC_FILES+=("ansible")
          [ -f "docker-compose.yml" ] && IAC_FILES+=("docker-compose")
          
          echo "iac=${IAC_FILES[@]}" >> $GITHUB_OUTPUT
          echo "Detected IaC: ${IAC_FILES[@]}"

      - name: Run Checkov (Terraform)
        if: contains(steps.detect-iac.outputs.iac, 'terraform')
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-terraform-results.sarif
          soft_fail: true
        continue-on-error: true

      - name: Run Checkov (Kubernetes)
        if: contains(steps.detect-iac.outputs.iac, 'kubernetes')
        uses: bridgecrewio/checkov-action@master
        with:
          directory: kubernetes/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-k8s-results.sarif
          soft_fail: true
        continue-on-error: true

      - name: Upload Checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '.'
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # License Compliance
  # ─────────────────────────────────────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: inputs.check-licenses
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for license policy
        id: check-policy
        run: |
          if [ -f "docs/license-policy.md" ] || [ -f "LICENSE-POLICY.md" ]; then
            echo "policy_exists=true" >> $GITHUB_OUTPUT
          else
            echo "policy_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No license policy found — skipping compliance check"
          fi

      - name: Detect package managers for license check
        id: detect-pkg
        run: |
          MANAGERS=()
          [ -f "package.json" ] && MANAGERS+=("npm")
          [ -f "requirements.txt" ] && MANAGERS+=("pip")
          [ -f "pyproject.toml" ] && MANAGERS+=("pip")
          
          echo "managers=${MANAGERS[@]}" >> $GITHUB_OUTPUT

      - name: Run license checker (npm)
        if: contains(steps.detect-pkg.outputs.managers, 'npm')
        run: |
          npm install -g license-checker
          license-checker --summary --production || echo "::warning::License check completed with warnings"
        continue-on-error: true

      - name: Run license checker (Python)
        if: contains(steps.detect-pkg.outputs.managers, 'pip')
        run: |
          pip install pip-licenses --quiet
          pip-licenses --with-system --format=markdown || echo "::warning::License check completed with warnings"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Secret Scanning (additional layer)
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@4f9a10a3b6e2a7a1b5d6b5a5e5e5e5e5e5e5e5e5 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
