# ci-base.yml — Reusable CI baseline for all jolarca repositories
# Called by individual repos via: uses: jolarca-dev/.github/.github/workflows/ci-base.yml@main
#
# This workflow provides consistent CI checks across all repos:
# - Conventional Commits validation
# - Secret scanning (gitleaks)
# - File hygiene (trailing whitespace, EOF, YAML validation)
# - License/SECURITY/CONTRIBUTING presence
#
# Compliance: SOC 2 CC8.1 (change management), ISO 27001 A.8.25 (secure SDLC)

name: CI Base (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.12'
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '20'
        type: string
      run-python-lint:
        description: 'Run Python linting (ruff/mypy)'
        required: false
        default: false
        type: boolean
      run-js-lint:
        description: 'Run JavaScript linting (eslint)'
        required: false
        default: false
        type: boolean
      run-terraform-fmt:
        description: 'Run Terraform format check'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  governance:
    name: Governance Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Required governance files present
        run: |
          REQUIRED_FILES=(
            "README.md"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "LICENSE"
          )
          
          MISSING=()
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              MISSING+=("$f")
            fi
          done
          
          if [ ${#MISSUES[@]} -gt 0 ]; then
            echo "::error::Missing or empty required files: ${MISSING[*]}"
            exit 1
          fi
          
          echo "✓ All governance files present"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate PR title follows Conventional Commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+$'
          
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title does not follow Conventional Commits format"
            echo "::error::Expected: type(scope): description"
            echo "::error::Got: $PR_TITLE"
            exit 1
          fi
          
          echo "✓ PR title follows Conventional Commits: $PR_TITLE"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@4f9a10a3b6e2a7a1b5d6b5a5e5e5e5e5e5e5e5e5 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  file-hygiene:
    name: File Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check YAML syntax
        run: |
          pip install yamllint --quiet
          YAML_FILES=$(find . -name "*.yml" -o -name "*.yaml" | grep -v node_modules | grep -v .terraform || true)
          
          if [ -n "$YAML_FILES" ]; then
            yamllint -d relaxed $YAML_FILES || echo "::warning::YAML lint issues found (non-blocking)"
          else
            echo "✓ No YAML files to check"
          fi

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    if: inputs.run-python-lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff (linter)
        run: ruff check . || echo "::warning::Ruff issues found"

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    if: inputs.run-js-lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npx eslint . || echo "::warning::ESLint issues found"

  terraform-fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    if: inputs.run-terraform-fmt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform format
        run: |
          terraform fmt -check -recursive || {
            echo "::error::Terraform files not formatted. Run 'terraform fmt -recursive'"
            exit 1
          }
          echo "✓ Terraform format check passed"
