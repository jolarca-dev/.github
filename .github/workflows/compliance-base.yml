# compliance-base.yml — Reusable compliance checks for all jolarca repositories
# Called by individual repos via: uses: jolarca-dev/.github/.github/workflows/compliance-base.yml@main
#
# This workflow provides consistent compliance checks across all repos:
# - Evidence integrity verification
# - Policy review date checks
# - Vendor assessment date checks
# - DSR (Data Subject Request) SLA monitoring
# - Retention schedule compliance
#
# Compliance: SOC 2 CC6.1, CC7.2, CC8.1 | ISO 27001 A.5-A.18 | GDPR Art. 5, 17, 30

name: Compliance Base (Reusable)

on:
  workflow_call:
    inputs:
      check-evidence-integrity:
        description: 'Verify evidence file hashes'
        required: false
        default: true
        type: boolean
      check-policy-dates:
        description: 'Check policy review dates'
        required: false
        default: true
        type: boolean
      check-vendor-dates:
        description: 'Check vendor assessment dates'
        required: false
        default: true
        type: boolean
      check-dsr-sla:
        description: 'Check DSR SLA compliance'
        required: false
        default: false
        type: boolean
      max-policy-overdue-days:
        description: 'Max days policy can be overdue'
        required: false
        default: 14
        type: number
      max-vendor-overdue-days:
        description: 'Max days vendor assessment can be overdue'
        required: false
        default: 30
        type: number

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Evidence Integrity: Verify audit evidence hasn't been tampered with
  # ─────────────────────────────────────────────────────────────────────────────
  evidence-integrity:
    name: Evidence Integrity
    runs-on: ubuntu-latest
    if: inputs.check-evidence-integrity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for evidence manifest
        id: check-manifest
        run: |
          if [ -f "audits/evidence-manifest.md" ] || [ -f "audits/evidence-manifest.csv" ]; then
            echo "manifest_exists=true" >> $GITHUB_OUTPUT
          else
            echo "manifest_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No evidence manifest found — skipping integrity check"
          fi

      - name: Verify evidence hashes
        if: steps.check-manifest.outputs.manifest_exists == 'true'
        run: |
          # Look for evidence hash verification script
          if [ -f "scripts/evidence-hash.py" ]; then
            python scripts/evidence-hash.py --verify || {
              echo "::error::Evidence integrity check failed"
              exit 1
            }
          else
            echo "::notice::No evidence-hash.py script found — skipping"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Policy Review Dates: Ensure policies are reviewed on schedule
  # ─────────────────────────────────────────────────────────────────────────────
  policy-review-dates:
    name: Policy Review Dates
    runs-on: ubuntu-latest
    if: inputs.check-policy-dates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for policy review script
        id: check-script
        run: |
          if [ -f "scripts/policy-review-dates.py" ]; then
            echo "script_exists=true" >> $GITHUB_OUTPUT
          else
            echo "script_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No policy-review-dates.py script found"
          fi

      - name: Run policy review date check
        if: steps.check-script.outputs.script_exists == 'true'
        run: |
          python scripts/policy-review-dates.py --max-days ${{ inputs.max-policy-overdue-days }} || {
            echo "::error::Policy review dates check failed"
            echo "::error::Policies overdue by more than ${{ inputs.max-policy-overdue-days }} days"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Vendor Assessment Dates: Ensure vendor re-assessments are on schedule
  # ─────────────────────────────────────────────────────────────────────────────
  vendor-assessment-dates:
    name: Vendor Assessment Dates
    runs-on: ubuntu-latest
    if: inputs.check-vendor-dates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for vendor review script
        id: check-script
        run: |
          if [ -f "scripts/vendor-review-dates.py" ]; then
            echo "script_exists=true" >> $GITHUB_OUTPUT
          else
            echo "script_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No vendor-review-dates.py script found"
          fi

      - name: Run vendor assessment date check
        if: steps.check-script.outputs.script_exists == 'true'
        run: |
          python scripts/vendor-review-dates.py --max-days ${{ inputs.max-vendor-overdue-days }} || {
            echo "::error::Vendor assessment dates check failed"
            echo "::error::Vendor assessments overdue by more than ${{ inputs.max-vendor-overdue-days }} days"
            exit 1
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # DSR SLA Monitoring: Track Data Subject Request response times
  # ─────────────────────────────────────────────────────────────────────────────
  dsr-sla-monitoring:
    name: DSR SLA Monitoring
    runs-on: ubuntu-latest
    if: inputs.check-dsr-sla
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for DSR SLA script
        id: check-script
        run: |
          if [ -f "scripts/dsr-sla-report.py" ]; then
            echo "script_exists=true" >> $GITHUB_OUTPUT
          else
            echo "script_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No dsr-sla-report.py script found"
          fi

      - name: Run DSR SLA report
        if: steps.check-script.outputs.script_exists == 'true'
        run: |
          # Find DSR register
          DSR_REGISTER=""
          for path in "data-subject-requests/register.md" "dsr/register.md" "gdpr/dsr-register.md"; do
            if [ -f "$path" ]; then
              DSR_REGISTER="$path"
              break
            fi
          done
          
          if [ -n "$DSR_REGISTER" ]; then
            python scripts/dsr-sla-report.py "$DSR_REGISTER"
          else
            echo "::notice::No DSR register found — skipping"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Retention Schedule Compliance: Verify retention jobs are running
  # ─────────────────────────────────────────────────────────────────────────────
  retention-compliance:
    name: Retention Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for retention code
        id: check-retention
        run: |
          if [ -d "retention" ] && [ -f "retention/matrix.yaml" ]; then
            echo "retention_exists=true" >> $GITHUB_OUTPUT
          else
            echo "retention_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::No retention code found — skipping"
          fi

      - name: Set up Python
        if: steps.check-retention.outputs.retention_exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run retention tests
        if: steps.check-retention.outputs.retention_exists == 'true'
        run: |
          pip install pyyaml --quiet
          python -m unittest retention.tests.test_retention -v || {
            echo "::error::Retention tests failed"
            exit 1
          }
